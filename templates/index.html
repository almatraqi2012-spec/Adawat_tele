<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة سهم - المحرك السحابي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- شاشة الدخول -->
    <div id="authSection" class="bg-gray-800 p-8 rounded-2xl w-full max-w-md border border-gray-700">
        <h1 class="text-2xl font-bold text-center mb-2 text-indigo-400">🚀 رادار سهم</h1>
        <form id="authForm" class="space-y-4">
            <input type="email" id="email" placeholder="البريد الإلكتروني" required class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600">
            <input type="password" id="password" placeholder="كلمة المرور" required class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600">
            <button type="submit" id="authBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-lg">تسجيل الدخول</button>
        </form>
    </div>

    <!-- شاشة الاشتراك المطلوب (80$) -->
    <div id="subSection" class="hidden bg-gray-800 p-8 rounded-2xl w-full max-w-md border border-amber-500/50 text-center">
        <div class="text-4xl mb-3">💳</div>
        <h2 class="text-xl font-bold text-amber-400 mb-2">الاشتراك غير مفعّل</h2>
        <p class="text-xs text-gray-300 mb-6">لاستخدام المحرك الخارق وربط أرقامك، يرجى تفعيل الاشتراك الشهري (80$ / شهرياً).</p>
        <button onclick="alert('تواصل مع إدارة البوت لتفعيل حسابك بعد الدفع')" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-black font-bold rounded-lg mb-3">تفعيل الاشتراك (80$)</button>
        <button onclick="logout()" class="text-xs text-gray-400 underline">تسجيل الخروج</button>
    </div>

    <!-- لوحة المحرك الحقيقي -->
    <div id="dashboardSection" class="hidden bg-gray-800 p-8 rounded-2xl w-full max-w-md border border-gray-700">
        <div class="flex justify-between items-center mb-4">
            <span class="text-xs text-emerald-400 font-bold">🟢 الاشتراك نشط</span>
            <button onclick="logout()" class="text-xs bg-red-600 px-2.5 py-1 rounded">خروج</button>
        </div>

        <!-- قسم ربط رقم جديد مثل البوت -->
        <div class="bg-gray-900 p-4 rounded-xl mb-6 border border-gray-700">
            <h3 class="text-sm font-bold text-indigo-400 mb-2">📱 ربط رقم تلغرام جديد:</h3>
            <div id="phoneStep1" class="space-y-2">
                <input type="text" id="phoneNum" placeholder="+966500000000" class="w-full p-2.5 bg-gray-800 text-sm rounded border border-gray-600">
                <button onclick="sendPhoneCode()" class="w-full py-2 bg-emerald-600 text-xs font-bold rounded">إرسال كود التحقق</button>
            </div>
            <div id="phoneStep2" class="hidden space-y-2 mt-2">
                <input type="text" id="telegramCode" placeholder="أدخل الكود الذي وصلك في التلغرام" class="w-full p-2.5 bg-gray-800 text-sm rounded border border-gray-600">
                <input type="password" id="twoFactorPass" placeholder="كلمة المرور 2FA (إن وجدت)" class="w-full p-2.5 bg-gray-800 text-sm rounded border border-gray-600">
                <button onclick="verifyCode()" class="w-full py-2 bg-indigo-600 text-xs font-bold rounded">تأكيد وربط الرقم</button>
            </div>
        </div>

        <!-- قسم السحب والإضافة -->
        <form id="radarForm" class="space-y-3">
            <input type="text" id="src" placeholder="المجموعة المصدر @source" required class="w-full p-2.5 bg-gray-700 rounded text-sm">
            <input type="text" id="trg" placeholder="المجموعة الهدف @target" required class="w-full p-2.5 bg-gray-700 rounded text-sm">
            <input type="number" id="count" value="10" placeholder="عدد الأعضاء" required class="w-full p-2.5 bg-gray-700 rounded text-sm">
            <button type="submit" id="runBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-lg">بدء الإضافة السحابية ⚡</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = "https://juuleypxvvcfgjdikpwu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Kh6iN4Aq6X6gLNcElNzgRg_CjlLMaZL";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user) initUser(session.user);
        };

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else initUser(data.user);
        });

        async function initUser(user) {
            currentUser = user;
            document.getElementById('authSection').classList.add('hidden');

            const fd = new FormData();
            fd.append('user_id', user.id);
            const res = await fetch('/api/check-subscription', { method: 'POST', body: fd });
            const data = await res.json();

            if (data.is_active) {
                document.getElementById('dashboardSection').classList.remove('hidden');
            } else {
                document.getElementById('subSection').classList.remove('hidden');
            }
        }

        async function sendPhoneCode() {
            const phone = document.getElementById('phoneNum').value;
            const fd = new FormData();
            fd.append('user_id', currentUser.id);
            fd.append('phone', phone);
            
            const res = await fetch('/api/send-code', { method: 'POST', body: fd });
            const data = await res.json();
            alert(data.message);
            if (data.status === 'success') {
                document.getElementById('phoneStep1').classList.add('hidden');
                document.getElementById('phoneStep2').classList.remove('hidden');
            }
        }

        async function verifyCode() {
            const code = document.getElementById('telegramCode').value;
            const password = document.getElementById('twoFactorPass').value;
            const fd = new FormData();
            fd.append('user_id', currentUser.id);
            fd.append('code', code);
            fd.append('password', password);

            const res = await fetch('/api/verify-code', { method: 'POST', body: fd });
            const data = await res.json();
            alert(data.message);
            if (data.status === 'success') location.reload();
        }

        document.getElementById('radarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('runBtn');
            btn.disabled = true;
            btn.innerText = "جاري التنفيذ عبر أرقامك المربوطة...";

            const fd = new FormData();
            fd.append('user_id', currentUser.id);
            fd.append('src', document.getElementById('src').value);
            fd.append('trg', document.getElementById('trg').value);
            fd.append('count', document.getElementById('count').value);

            const res = await fetch('/api/start-addition', { method: 'POST', body: fd });
            const data = await res.json();
            alert(data.message);
            btn.disabled = false;
            btn.innerText = "بدء الإضافة السحابية ⚡";
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }
    </script>
</body>
</html>
