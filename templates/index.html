<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رادار سهم للإضافة</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-400">🚀 رادار سهم الشامل</h1>
        
        <form id="radarForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">معرف المستخدم (UID):</label>
                <input type="text" id="uid" required class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">المجموعة المصدر (Source):</label>
                <input type="text" id="src" required class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">المجموعة الهدف (Target):</label>
                <input type="text" id="trg" required class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" id="submitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-bold transition duration-200">بدء الإضافة الآن</button>
        </form>

        <div id="statusBox" class="mt-6 hidden">
            <p id="statusText" class="text-sm text-center mb-2 text-indigo-300">جاري التشغيل...</p>
            <div class="w-full bg-gray-700 rounded-full h-4">
                <div id="progressBar" class="bg-indigo-500 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('radarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            
            btn.disabled = true;
            btn.classList.add('opacity-50');
            statusBox.classList.remove('hidden');
            
            statusText.innerText = "جاري الاتصال والبدء بالتنفيذ...";
            
            // إرسال الطلب للـ Backend
            const formData = new FormData();
            formData.append('uid', document.getElementById('uid').value);
            formData.append('src', document.getElementById('src').value);
            formData.append('trg', document.getElementById('trg').value);

            try {
                const res = await fetch('/api/add-batch', { method: 'POST', body: formData });
                const data = await res.json();
                statusText.innerText = data.message;
                document.getElementById('progressBar').style.width = '100%';
            } catch (err) {
                statusText.innerText = "حدث خطأ أثناء الاتصال بالخادم";
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        });
    </script>
</body>
</html>
